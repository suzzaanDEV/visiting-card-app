server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Card uploads can be up to 10MB (backend limit is 10mb); leave headroom.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container. The trailing slash keeps
    # the /api prefix intact so the Express app's mounts (/api/...) match.
    location /api/ {
        proxy_pass http://backend:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}