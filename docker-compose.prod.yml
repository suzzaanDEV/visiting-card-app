version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: cardly-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database port is not exposed to the public internet for security

  redis:
    image: redis:7-alpine
    container_name: cardly-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    # Redis port is not exposed to the public internet for security

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardly-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: mongodb://mongodb:27017/cardly
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN_NAME}
      CORS_ORIGINS: https://${DOMAIN_NAME}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5050/health']
      interval: 30s
      timeout: 5s
      retries: 3
    # Backend port is not exposed publicly, proxying via frontend/Caddy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Build using a relative endpoint. This makes the build completely
        # portable under any domain name.
        VITE_API_URL: /api
    container_name: cardly-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    # Exposing only internally to Caddy, no public host port mapping needed

  caddy:
    image: caddy:2-alpine
    container_name: cardly-caddy-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mongo_data_prod:
  redis_data_prod:
  caddy_data:
  caddy_config:
